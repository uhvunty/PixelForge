{% extends "base.html" %}

{% block title %}
Login — PixelForge
{% endblock %}


{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <span class="section-label">
                WELCOME BACK
            </span>

            <h1>
                Login to PixelForge
            </h1>

            <p>
                Continue creating your pixel art.
            </p>

        </div>


        <form
            method="POST"
            action="{{ url_for('auth.login') }}"
            data-auth-form
            class="auth-form"
        >

            <div class="form-group">

                <label for="identifier">
                    Username or Email
                </label>

                <input
                    type="text"
                    id="identifier"
                    name="identifier"
                    placeholder="Enter your username or email"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    data-password-toggle
                    required
                >

            </div>


            <button
                type="submit"
                class="button primary full-width"
            >
                Login
            </button>

        </form>


        <div class="auth-footer">

            <p>
                Don't have an account?
                <a href="{{ url_for('auth.register') }}">
                    Create one
                </a>
            </p>

        </div>

    </div>

</section>

{% endblock %}


{% block scripts %}

<script
    src="{{ url_for('static', filename='js/auth.js') }}"
></script>

{% endblock %}
