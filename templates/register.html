{% extends "base.html" %}

{% block title %}
Register — PixelForge
{% endblock %}


{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <span class="section-label">
                JOIN PIXELFORGE
            </span>

            <h1>
                Create your account
            </h1>

            <p>
                Start creating and sharing pixel art.
            </p>

        </div>


        <form
            method="POST"
            action="{{ url_for('auth.register') }}"
            data-auth-form
            class="auth-form"
        >

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    autocomplete="username"
                    minlength="3"
                    maxlength="50"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="At least 8 characters"
                    autocomplete="new-password"
                    data-password-toggle
                    minlength="8"
                    required
                >

            </div>


            <button
                type="submit"
                class="button primary full-width"
            >
                Create Account
            </button>

        </form>


        <div class="auth-footer">

            <p>
                Already have an account?
                <a href="{{ url_for('auth.login') }}">
                    Login
                </a>
            </p>

        </div>

    </div>

</section>

{% endblock %}


{% block scripts %}

<script
    src="{{ url_for('static', filename='js/auth.js') }}"
></script>

{% endblock %}
